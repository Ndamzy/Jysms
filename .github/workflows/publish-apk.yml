name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate existing APK and checksum
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          test -f "$APK_PATH" || { echo "Error: $APK_PATH is missing."; exit 1; }
          test -s "$APK_PATH" || { echo "Error: $APK_PATH is empty."; exit 1; }
          test -f "$SHA_PATH" || { echo "Error: $SHA_PATH is missing."; exit 1; }

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)
          unzip -tq "$APK_PATH"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          SHA256=$(awk '{print $1}' apk-distribution/app-debug.apk.sha256)
          APK_BYTES=$(wc -c < "$APK_PATH" | tr -d ' ')
          APK_HUMAN=$(ls -lh "$APK_PATH" | awk '{print $5}')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          NOTES=$(printf 'Prebuilt Android debug APK verified before release.\n\n- **Release Tag:** `%s`\n- **APK Size:** %s (%s bytes)\n- **SHA-256:** `%s`' "$TAG" "$APK_HUMAN" "$APK_BYTES" "$SHA256")

          gh release create "$TAG" \
            "${APK_PATH}#app-debug.apk" \
            --title "JY-SMS Debug APK (${TAG})" \
            --notes "$NOTES" \
            --latest

          {
            echo "## Debug APK Release Published"
            echo ""
            echo "- **Release Tag:** \`${TAG}\`"
            echo "- **APK Size:** ${APK_HUMAN} (${APK_BYTES} bytes)"
            echo "- **SHA-256:** \`${SHA256}\`"
            echo "- **GitHub Release Page:** ${RELEASE_URL}"
            echo "- **Direct Latest APK Download URL:** ${DIRECT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
